spring.application.name=ms-usuarios
server.port=8081

# H2 en archivo: los datos persisten entre reinicios en ./data
spring.datasource.url=jdbc:h2:file:./data/usuarios
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola para mostrar las tablas: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para que la app reciba el mensaje de error (409, 401, 404)
server.error.include-message=always